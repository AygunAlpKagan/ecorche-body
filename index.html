<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ecorche-body</title>
    <style>
      html, body, #root { margin: 0; min-height: 100%; background: #0e1218; color: #eef1f5; font-family: "Segoe UI", system-ui, sans-serif; }
      body { padding: 1.25rem; }
      .play { display: grid; gap: 1.1rem; max-width: 820px; margin: 0 auto; }
      .kicker { margin: 0; letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.72rem; color: #9aa3ae; }
      h1, h2 { margin: 0.15rem 0 0; font-weight: 700; }
      header p { color: #9aa3ae; }
      .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.7rem; }
      label { display: grid; gap: 0.3rem; font-size: 0.78rem; color: #9aa3ae; }
      select, input { width: 100%; }
      details { color: #9aa3ae; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/playground.jsx"></script>
  </body>
</html>
